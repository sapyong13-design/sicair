name: Deploy to sicair.duckdns.org

on:
  push:
    branches:
      - postgresql

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Composer install
        run: composer install --no-dev --prefer-dist --no-interaction

      - name: Run unit tests
        run: php artisan test --testsuite=Unit --no-interaction

  deploy:
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy code to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 43.129.38.24
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "."
          target: /home/ubuntu/sicair-new
          rm: true

      - name: Build and restart container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.129.38.24
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /home/ubuntu/deploy-sicair.sh
          command_timeout: 30m
